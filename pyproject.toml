[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spelunky2rl"
dynamic = ["version"]
description = "Gymnasium environments for Spelunky 2 reinforcement learning"
readme = "readme.md"
authors = [{name = "vicbentu"}]
license = "MIT"
license-files = ["LICENSE", "src/spelunky2rl/mod/lua/luasocket/license.txt"]
requires-python = ">=3.9"

# Core dependencies - required for basic SpelunkyRL functionality
dependencies = [
    "gymnasium",
    "numpy",
    "psutil",
]

[project.urls]
Repository = "https://github.com/vicbentu/spelunky2rl"
Documentation = "https://github.com/vicbentu/spelunky2rl/tree/main/docs"
Issues = "https://github.com/vicbentu/spelunky2rl/issues"

[project.scripts]
spelunky2rl = "spelunky2rl.cli:main"

# Optional dependencies for specific use cases
[project.optional-dependencies]
# For training RL agents (examples/train_get_to_exit.py)
train = [
    "torch",
    "stable-baselines3",
    "sb3-contrib",
]

# render() with launcher="wine" (captures the instance's X display; Docker does not need it)
render = [
    "mss>=10.2",
]

# For recording videos (examples/record_video.py)
video = [
    "opencv-python",
]

# Tests and linting
dev = [
    "pytest",
    "ruff",
]

# Install everything
all = [
    "spelunky2rl[train,render,video]",
]

[tool.setuptools.dynamic]
version = {attr = "spelunky2rl.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spelunky2rl = ["mod/**/*", "tools/*.md", "engine/launchers/config/*.ini", "engine/launchers/config/*.cfg"]
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
